# Telugu Pickles — application resources deployed by Argo CD to AKS.
#   Preview:  kubectl kustomize gitops/
#   Deployed by Argo CD after scripts/bootstrap-aks.ps1 installs it in AKS.
#   The app namespace and Kubernetes secret are initialized by that script.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s/platform/storageclass.yml
  - k8s/platform/config.yml
  - k8s/database/postgres.yml
  - k8s/apps/auth-service.yml
  - k8s/apps/catalog-service.yml
  - k8s/apps/cart-service.yml
  - k8s/apps/order-service.yml
  - k8s/apps/payment-service.yml
  - k8s/apps/gateway.yml
  - k8s/apps/frontend.yml
  - k8s/apps/analysis.yml
  - k8s/apps/autoscaling.yml
  - k8s/monitoring/servicemonitor.yml
configMapGenerator:
  # Grafana's sidecar imports any ConfigMap labelled grafana_dashboard=1
  - name: telugu-pickles-dashboard
    namespace: monitoring
    files:
      - k8s/monitoring/telugu-pickles-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
# App CI rewrites newName/newTag after pushing to ACR (.github/workflows/ci.yml, "deploy" job).
images:
  - name: telugu-pickles/frontend
    newName: YOUR_ACR_NAME.azurecr.io/telugu-pickles/frontend
    newTag: latest
  - name: telugu-pickles/gateway
    newName: YOUR_ACR_NAME.azurecr.io/telugu-pickles/gateway
    newTag: latest
  - name: telugu-pickles/auth-service
    newName: YOUR_ACR_NAME.azurecr.io/telugu-pickles/auth-service
    newTag: latest
  - name: telugu-pickles/catalog-service
    newName: YOUR_ACR_NAME.azurecr.io/telugu-pickles/catalog-service
    newTag: latest
  - name: telugu-pickles/cart-service
    newName: YOUR_ACR_NAME.azurecr.io/telugu-pickles/cart-service
    newTag: latest
  - name: telugu-pickles/order-service
    newName: YOUR_ACR_NAME.azurecr.io/telugu-pickles/order-service
    newTag: latest
  - name: telugu-pickles/payment-service
    newName: YOUR_ACR_NAME.azurecr.io/telugu-pickles/payment-service
    newTag: latest
