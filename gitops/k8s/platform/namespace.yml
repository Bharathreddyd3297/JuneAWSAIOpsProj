apiVersion: v1
kind: Namespace
metadata:
  name: telugu-pickles
  labels:
    app.kubernetes.io/part-of: telugu-pickles
    # Pod Security Admission: reject privileged / root pods in this namespace
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# gp3 EBS volumes via the EBS CSI driver (installed by Terraform with IRSA).
# Newer EKS versions no longer mark gp2 as default, so we define our own class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
