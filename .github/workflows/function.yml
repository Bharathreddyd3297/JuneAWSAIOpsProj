name: AIOps Function

on:
  push:
    branches: [azure-migration]
    paths:
      - "projects/aiops-assistant/function/**"
      - ".github/workflows/function.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiops-function-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure Function (Flex Consumption)
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Function code
        run: python -m compileall -q projects/aiops-assistant/function
      - name: Check deployment configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          FUNCTION_APP_NAME: ${{ vars.AIOPS_FUNCTION_APP_NAME }}
        run: |
          for value in "$CLIENT_ID" "$TENANT_ID" "$SUBSCRIPTION_ID" "$FUNCTION_APP_NAME"; do
            if [ -z "$value" ]; then
              echo "::error::Set the Azure OIDC variables and AIOPS_FUNCTION_APP_NAME repository variable."
              exit 1
            fi
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function package
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AIOPS_FUNCTION_APP_NAME }}
          package: projects/aiops-assistant/function
          sku: flexconsumption
          remote-build: true
