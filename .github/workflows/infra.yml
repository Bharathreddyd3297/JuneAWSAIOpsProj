name: Azure Infrastructure

on:
  push:
    branches: [azure-migration]
    paths:
      - "projects/Infrastructure/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "projects/Infrastructure/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: 'Type "destroy" to confirm destroying Azure resources'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Format and validate
        working-directory: projects/Infrastructure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

  plan:
    name: Terraform plan
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.AZURE_CLIENT_ID != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: projects/Infrastructure
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER || 'tfstate' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'telugu-pickles/infrastructure.tfstate' }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP || 'telugu-pickles-azure' }}
      TF_VAR_cluster_name: ${{ vars.AKS_CLUSTER_NAME || 'telugu-pickles-aks' }}
      TF_VAR_node_vm_size: ${{ vars.AKS_NODE_VM_SIZE }}
      TF_VAR_github_actions_principal_id: ${{ vars.AZURE_GITHUB_PRINCIPAL_ID }}
      TF_VAR_aks_admin_principal_ids: ${{ vars.AKS_ADMIN_PRINCIPAL_IDS_JSON || '[]' }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Validate deployment configuration
        run: |
          for value in "$ARM_CLIENT_ID" "$ARM_TENANT_ID" "$ARM_SUBSCRIPTION_ID" "$TF_STATE_RESOURCE_GROUP" "$TF_STATE_STORAGE_ACCOUNT" "$TF_VAR_node_vm_size" "$TF_VAR_github_actions_principal_id"; do
            if [ -z "$value" ]; then
              echo "::error::Set Azure OIDC, Terraform state, AKS node SKU, and bootstrap identity repository variables before planning."
              exit 1
            fi
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize Terraform backend
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY"
      - name: Terraform plan
        run: |
          terraform plan -lock-timeout=10m -no-color -out=tfplan | tee plan.txt
          {
            echo "### Azure Terraform plan"
            echo '```'
            grep -E "^Plan:|^No changes|will be (created|destroyed|replaced)|must be replaced" plan.txt | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Terraform apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: projects/Infrastructure
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER || 'tfstate' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'telugu-pickles/infrastructure.tfstate' }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP || 'telugu-pickles-azure' }}
      TF_VAR_cluster_name: ${{ vars.AKS_CLUSTER_NAME || 'telugu-pickles-aks' }}
      TF_VAR_node_vm_size: ${{ vars.AKS_NODE_VM_SIZE }}
      TF_VAR_github_actions_principal_id: ${{ vars.AZURE_GITHUB_PRINCIPAL_ID }}
      TF_VAR_aks_admin_principal_ids: ${{ vars.AKS_ADMIN_PRINCIPAL_IDS_JSON || '[]' }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize Terraform backend
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY"
      - name: Apply fresh plan
        run: |
          terraform plan -lock-timeout=10m -out=tfplan
          terraform apply -lock-timeout=10m -auto-approve tfplan
      - name: Show Azure outputs
        run: |
          {
            echo "### Azure infrastructure provisioned"
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| Resource group | $(terraform output -raw resource_group_name) |"
            echo "| AKS cluster | $(terraform output -raw cluster_name) |"
            echo "| ACR | $(terraform output -raw acr_login_server) |"
            echo "| AIOps Function | $(terraform output -raw aiops_function_app_name) |"
            echo "| AIOps model endpoint | $(terraform output -raw azure_openai_endpoint) |"
            echo "| AIOps model deployment | $(terraform output -raw azure_openai_deployment_name) |"
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Terraform destroy
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: projects/Infrastructure
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER || 'tfstate' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'telugu-pickles/infrastructure.tfstate' }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP || 'telugu-pickles-azure' }}
      TF_VAR_cluster_name: ${{ vars.AKS_CLUSTER_NAME || 'telugu-pickles-aks' }}
      TF_VAR_node_vm_size: ${{ vars.AKS_NODE_VM_SIZE }}
      TF_VAR_github_actions_principal_id: ${{ vars.AZURE_GITHUB_PRINCIPAL_ID }}
      TF_VAR_aks_admin_principal_ids: ${{ vars.AKS_ADMIN_PRINCIPAL_IDS_JSON || '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize Terraform backend
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY"
      - name: Destroy Azure resources
        run: |
          bash ../../scripts/pre-destroy.sh "$TF_VAR_resource_group_name" "$TF_VAR_cluster_name" --confirm
          terraform destroy -auto-approve -lock-timeout=10m
