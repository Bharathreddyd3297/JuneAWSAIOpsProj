name: App CI

on:
  push:
    branches: [azure-migration]
    paths:
      - "projects/telugu-pickles/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/telugu-pickles/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_TAG: ${{ github.sha }}
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  TRIVY_DB: ghcr.io/aquasecurity/trivy-db:2
  RELEASE: ${{ github.ref == 'refs/heads/azure-migration' && github.event_name != 'pull_request' }}

jobs:
  security:
    name: Security scan
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  test:
    name: Unit tests + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            projects/telugu-pickles/services/package-lock.json
            projects/telugu-pickles/frontend/package-lock.json
      - name: Backend unit tests
        working-directory: projects/telugu-pickles/services
        run: npm ci --no-audit --no-fund && npm test
      - name: Frontend production build
        working-directory: projects/telugu-pickles/frontend
        run: npm ci --no-audit --no-fund && npm run build

  azure:
    name: Azure OIDC and ACR check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.registry.outputs.enabled }}
      registry: ${{ steps.registry.outputs.registry }}
    steps:
      - id: check
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ] && [ -n "$ACR_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Azure publishing not configured::Add Azure OIDC and ACR repository variables. Tests and image scans still run."
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: registry
        if: steps.check.outputs.enabled == 'true'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          if ! az acr show --name "$ACR_NAME" >/dev/null 2>&1; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ACR unavailable::Create the infrastructure first; images will not be pushed."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "registry=${ACR_NAME}.azurecr.io" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.enabled != 'true'
        id: skipped
        run: echo "enabled=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build · scan · push (${{ matrix.service }})
    needs: [security, test, azure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, gateway, auth-service, catalog-service, cart-service, order-service, payment-service]
    env:
      LOCAL_IMAGE: telugu-pickles/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: projects/telugu-pickles/${{ matrix.service == 'frontend' && 'frontend' || 'services' }}
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image "$LOCAL_IMAGE" \
            --db-repository "$TRIVY_DB" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 --no-progress
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image "$LOCAL_IMAGE" \
            --db-repository "$TRIVY_DB" --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --quiet
      - if: env.RELEASE == 'true' && needs.azure.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push to Azure Container Registry
        if: env.RELEASE == 'true' && needs.azure.outputs.enabled == 'true'
        env:
          REGISTRY: ${{ needs.azure.outputs.registry }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          REPO: telugu-pickles/${{ matrix.service }}
        run: |
          az acr login --name "$ACR_NAME"
          docker tag "$LOCAL_IMAGE" "$REGISTRY/$REPO:$IMAGE_TAG"
          docker push "$REGISTRY/$REPO:$IMAGE_TAG"
          echo "Pushed \`$REGISTRY/$REPO:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Update gitops/ (Argo CD deploys)
    needs: [azure, build]
    if: github.ref == 'refs/heads/azure-migration' && github.event_name != 'pull_request' && needs.azure.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      REGISTRY: ${{ needs.azure.outputs.registry }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      SERVICES: frontend gateway auth-service catalog-service cart-service order-service payment-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: azure-migration
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check every image reached ACR
        id: images
        run: |
          for svc in $SERVICES; do
            if ! az acr repository show-tags --name "$ACR_NAME" --repository "telugu-pickles/$svc" --output tsv | grep -Fxq "$IMAGE_TAG"; then
              echo "::warning title=Not deploying::telugu-pickles/$svc:$IMAGE_TAG is not in ACR. gitops/ left unchanged."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Point gitops/kustomization.yml at the new images
        if: steps.images.outputs.ready == 'true'
        run: |
          for svc in $SERVICES; do
            docker run --rm -v "$PWD:/work" -w /work mikefarah/yq:4.44.3 \
              -i "(.images[] | select(.name == \"telugu-pickles/${svc}\")) |= (.newName = \"${REGISTRY}/telugu-pickles/${svc}\" | .newTag = \"${IMAGE_TAG}\")" \
              gitops/kustomization.yml
          done
          git diff --stat
      - name: Commit and push
        if: steps.images.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/kustomization.yml
          if git diff --staged --quiet; then echo "Images already deployed"; exit 0; fi
          git commit -m "deploy: telugu-pickles ${IMAGE_TAG::7}"
          pushed=false
          for attempt in 1 2 3; do
            if git pull --rebase origin azure-migration && git push origin HEAD:azure-migration; then
              pushed=true
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$pushed" != true ]; then echo "::error::Could not push the GitOps image update."; exit 1; fi
          {
            echo "### Deployed \`${IMAGE_TAG::7}\` to ACR"
            echo "Argo CD syncs the updated GitOps commit. Check the AKS Argo CD application for health."
            echo ""
            echo "| Service | Release strategy |"
            echo "|---|---|"
            echo "| frontend | **Blue-green**; inspect the preview with \`kubectl port-forward svc/frontend-preview 8080:80 -n telugu-pickles\`, then promote |"
            echo "| catalog-service | **Canary** with Prometheus error-rate checks and automatic rollback |"
            echo "| other services | Rolling update |"
          } >> "$GITHUB_STEP_SUMMARY"
