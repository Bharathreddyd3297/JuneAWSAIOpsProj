name: Azure App CI

on:
  push:
    branches: [main]
    paths:
      - "projects/telugu-pickles/**"
      - "projects/aiops-assistant/**"
  pull_request:
    paths:
      - "projects/telugu-pickles/**"
      - "projects/aiops-assistant/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-app-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'telugu-pickles-azure' }}
  IMAGE_TAG: ${{ github.sha }}
  TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  TRIVY_DB: ghcr.io/aquasecurity/trivy-db:2

jobs:
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            projects/telugu-pickles/services/package-lock.json
            projects/telugu-pickles/frontend/package-lock.json
      - name: Backend unit tests
        working-directory: projects/telugu-pickles/services
        run: npm ci --no-audit --no-fund && npm test
      - name: Frontend production build
        working-directory: projects/telugu-pickles/frontend
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/aiops-assistant/requirements-dev.txt
      - name: AIOps API tests
        working-directory: projects/aiops-assistant
        run: |
          pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v

  build:
    name: Build · scan · push (${{ matrix.service }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [security, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, gateway, auth-service, catalog-service, cart-service, order-service, payment-service, aiops-assistant]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [ "$SERVICE" = "frontend" ]; then
            context="projects/telugu-pickles/frontend"
          elif [ "$SERVICE" = "aiops-assistant" ]; then
            context="projects/aiops-assistant"
          else
            context="projects/telugu-pickles/services"
          fi
          docker build --pull --build-arg SERVICE="$SERVICE" -t "telugu-pickles/$SERVICE:$IMAGE_TAG" "$context"

      - name: Trivy image scan
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image "telugu-pickles/$SERVICE:$IMAGE_TAG" \
            --db-repository "$TRIVY_DB" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image "telugu-pickles/$SERVICE:$IMAGE_TAG" \
            --db-repository "$TRIVY_DB" --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet

      - name: Push to ACR
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          acr_name=$(az acr list --resource-group "$AZURE_RESOURCE_GROUP" --query '[0].name' -o tsv)
          if [ -z "$acr_name" ]; then
            echo "::error::No ACR found. Run Azure Infrastructure apply first."
            exit 1
          fi
          login_server=$(az acr show --name "$acr_name" --query loginServer -o tsv)
          az acr login --name "$acr_name"
          docker tag "telugu-pickles/$SERVICE:$IMAGE_TAG" "$login_server/telugu-pickles/$SERVICE:$IMAGE_TAG"
          docker push "$login_server/telugu-pickles/$SERVICE:$IMAGE_TAG"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Point Azure GitOps at the new images
        run: |
          acr_name=$(az acr list --resource-group "$AZURE_RESOURCE_GROUP" --query '[0].name' -o tsv)
          login_server=$(az acr show --name "$acr_name" --query loginServer -o tsv)
          overlays="gitops/overlays/azure/kustomization.yml gitops/overlays/azure-no-aiops/kustomization.yml"
          services="frontend gateway auth-service catalog-service cart-service order-service payment-service aiops-assistant"
          for overlay in $overlays; do
            for service in $services; do
              yq -i "(.images[] | select(.name == \"telugu-pickles/$service\")) |= (.newName = \"$login_server/telugu-pickles/$service\" | .newTag = \"$IMAGE_TAG\")" "$overlay"
            done
          done
      - name: Commit deployment tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/overlays/azure/kustomization.yml gitops/overlays/azure-no-aiops/kustomization.yml
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "deploy(azure): telugu-pickles ${IMAGE_TAG::7}"
          git pull --rebase origin main
          git push origin HEAD:main
