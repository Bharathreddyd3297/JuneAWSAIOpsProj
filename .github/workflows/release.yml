name: Release control

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: "Which service"
        type: choice
        options: [frontend, catalog-service]
        default: frontend
      action:
        description: "What to do"
        type: choice
        options: [status, promote, full, abort, retry, undo]
        default: status

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.rollout }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CLUSTER: ${{ vars.AKS_CLUSTER_NAME || 'telugu-pickles-aks' }}
  NAMESPACE: telugu-pickles
  ROLLOUTS_VERSION: v1.10.2
  ROLLOUTS_SHA256: 355d62379d787a778f92903ce0b2fc1c1f4999d790d829370b6f1854a55f1cf9

jobs:
  release:
    name: ${{ inputs.action }} ${{ inputs.rollout }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Azure configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          for value in "$CLIENT_ID" "$TENANT_ID" "$SUBSCRIPTION_ID" "$RESOURCE_GROUP"; do
            if [ -z "$value" ]; then echo "::error::Set Azure OIDC and AKS repository variables."; exit 1; fi
          done

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Connect kubectl to AKS
        run: |
          if ! az aks show --resource-group "$RESOURCE_GROUP" --name "$CLUSTER" >/dev/null 2>&1; then
            echo "::error::AKS cluster $CLUSTER does not exist. Apply Infrastructure first."; exit 1
          fi
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$CLUSTER" --overwrite-existing
          az aks install-cli
          kubelogin convert-kubeconfig -l azurecli

      - name: Install the Argo Rollouts kubectl plugin (checksum-verified)
        run: |
          curl -sSLo kubectl-argo-rollouts "https://github.com/argoproj/argo-rollouts/releases/download/${ROLLOUTS_VERSION}/kubectl-argo-rollouts-linux-amd64"
          echo "${ROLLOUTS_SHA256}  kubectl-argo-rollouts" | sha256sum -c -
          chmod +x kubectl-argo-rollouts && sudo mv kubectl-argo-rollouts /usr/local/bin/

      - name: ${{ inputs.action }}
        env:
          ROLLOUT: ${{ inputs.rollout }}
          ACTION: ${{ inputs.action }}
        run: |
          r="kubectl argo rollouts -n $NAMESPACE"
          case "$ACTION" in
            status)  ;;
            promote) $r promote "$ROLLOUT" ;;
            full)    $r promote "$ROLLOUT" --full ;;
            abort)   $r abort "$ROLLOUT" ;;
            retry)   $r retry rollout "$ROLLOUT" ;;
            undo)    $r undo "$ROLLOUT" ;;
          esac
          sleep 5
          $r get rollout "$ROLLOUT" --no-color | tee status.txt

      - name: Summary
        if: always()
        env:
          ROLLOUT: ${{ inputs.rollout }}
          ACTION: ${{ inputs.action }}
        run: |
          {
            echo "### ${ACTION} \`${ROLLOUT}\`"
            if [ "$ROLLOUT" = frontend ]; then
              echo "Preview: \`kubectl port-forward svc/frontend-preview 8080:80 -n $NAMESPACE\` while the rollout is paused."
            fi
            echo '```'; cat status.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
