name: Azure Release Control

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: Which service
        type: choice
        options: [frontend, catalog-service]
        default: frontend
      action:
        description: What to do
        type: choice
        options: [status, promote, full, abort, retry, undo]
        default: status

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'telugu-pickles-azure' }}
  CLUSTER: ${{ vars.AZURE_AKS_CLUSTER || 'telugu-pickles-aks' }}
  NAMESPACE: telugu-pickles
  ROLLOUTS_VERSION: v1.10.2
  ROLLOUTS_SHA256: 355d62379d787a778f92903ce0b2fc1c1f4999d790d829370b6f1854a55f1cf9

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_RELEASE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.22
      - name: Connect to AKS
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig --login azurecli
      - name: Install Argo Rollouts plugin
        run: |
          curl -sSLo kubectl-argo-rollouts "https://github.com/argoproj/argo-rollouts/releases/download/${ROLLOUTS_VERSION}/kubectl-argo-rollouts-linux-amd64"
          echo "${ROLLOUTS_SHA256}  kubectl-argo-rollouts" | sha256sum -c -
          chmod +x kubectl-argo-rollouts
          sudo mv kubectl-argo-rollouts /usr/local/bin/
      - name: Control rollout
        env:
          ROLLOUT: ${{ inputs.rollout }}
          ACTION: ${{ inputs.action }}
        run: |
          command="kubectl argo rollouts -n $NAMESPACE"
          case "$ACTION" in
            status)  ;;
            promote) $command promote "$ROLLOUT" ;;
            full)    $command promote "$ROLLOUT" --full ;;
            abort)   $command abort "$ROLLOUT" ;;
            retry)   $command retry rollout "$ROLLOUT" ;;
            undo)    $command undo "$ROLLOUT" ;;
          esac
          $command get rollout "$ROLLOUT" --no-color
